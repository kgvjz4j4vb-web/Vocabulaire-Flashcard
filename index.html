<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<title>French Vocab Flashcards</title>
<style>
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f6fa;
    display: flex;
    justify-content: center;
    padding: 24px;
  }
  #card {
    background: #ffffff;
    width: 360px;
    padding: 24px 20px 28px;
    border-radius: 18px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.12);
    text-align: center;
  }
  #image-wrapper {
    width: 200px;
    height: 200px;
    margin: 0 auto 16px;
    border-radius: 32px;
    background: #f0f4ff;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #image {
    width: 70%;
    height: 70%;
    object-fit: contain;
  }
  #word {
    font-size: 24px;
    font-weight: 600;
    color: #222;
    margin-bottom: 6px;
  }
  #hint {
    font-size: 13px;
    color: #888;
    margin-bottom: 10px;
  }
  #translation {
    margin-top: 14px;
    font-size: 20px;
    font-weight: 600;
    color: #444;
    min-height: 26px;
  }
  button {
    padding: 10px 18px;
    margin: 8px 6px 0;
    border: none;
    border-radius: 999px;
    background: #2563eb;
    color: white;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }
  button:hover {
    background: #1d4ed8;
  }
  button:active {
    transform: scale(0.97);
  }
  #next-btn {
    background: #10b981;
  }
  #next-btn:hover {
    background: #059669;
  }
</style>
</head>

<div id="card">
  <div id="image-wrapper">

  <div id="word"></div>

  <button id="next-btn" onclick="nextCard()">Next</button>
  <div id="translation"></div>

let currentCard = null;
let showFrench = true;

function nextCard() {
  currentCard = vocab[Math.floor(Math.random() * vocab.length)];
  showFrench = Math.random() < 0.5;

  const img = document.getElementById("image");
  img.src = currentCard.img;
  img.alt = showFrench ? currentCard.fr : currentCard.en;

  document.getElementById("word").textContent = showFrench ? currentCard.fr : currentCard.en;
  document.getElementById("hint").textContent = showFrench ? "French → English" : "English → French";
  document.getElementById("translation").textContent = "";
}

function showAnswer() {
  if (!currentCard) return;
  const translation = showFrench ? currentCard.en : currentCard.fr;
  document.getElementById("translation").textContent = translation;
}

nextCard();
