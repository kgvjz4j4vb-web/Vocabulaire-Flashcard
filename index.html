<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>French Flashcards</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f7f7f7;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }
    #card {
        background: white;
        width: 320px;
        padding: 20px;
        border-radius: 20px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        text-align: center;
    }
    img {
        width: 120px;
        height: 120px;
        border-radius: 20px;
        margin-bottom: 15px;
    }
    button {
        padding: 10px 20px;
        margin: 10px;
        border: none;
        border-radius: 10px;
        background: #4a90e2;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }
    button:hover {
        background: #357ABD;
    }
</style>
</head>
<body>

<div id="card">
    <img id="image" src="">
    <h2 id="word"></h2>
    <p id="translation" style="display:none; font-size:18px; margin-top:10px;"></p>
    <button onclick="showTranslation()">Show</button>
    <button onclick="nextCard()">Next</button>
</div>

<script>
const vocab = [
    { fr: "un bras", en: "arm", img: "arm.png" },
    { fr: "un sac à dos", en: "backpack", img: "backpack.png" },
    { fr: "une ceinture", en: "belt", img: "belt.png" },
    { fr: "un bikini", en: "bikini", img: "bikini.png" },
    { fr: "des bottes", en: "boots", img: "boots.png" },
    { fr: "un bracelet", en: "bracelet", img: "bracelet.png" },
    { fr: "une broche", en: "brooch", img: "brooch.png" },
    { fr: "une robe", en: "dress", img: "dress.png" },
    { fr: "une boucle d’oreille", en: "earring", img: "earring.png" },
    { fr: "des lunettes", en: "glasses", img: "glasses.png" },
    { fr: "des gants", en: "gloves", img: "gloves.png" },
    { fr: "un sac à main", en: "handbag", img: "handbag.png" },
    { fr: "un chapeau", en: "hat", img: "hat.png" },
    { fr: "une tête", en: "head", img: "head.png" },
    { fr: "un cœur", en: "heart", img: "heart.png" },
    { fr: "une veste", en: "jacket", img: "jacket.png" },
    { fr: "un jean", en: "jeans", img: "jeans.png" },
    { fr: "une jambe", en: "leg", img: "leg.png" },
    { fr: "une bouche", en: "mouth", img: "mouth.png" },
    { fr: "un collier", en: "necklace", img: "necklace.png" },
    { fr: "un pantalon", en: "pants", img: "pants.png" },
    { fr: "une bague", en: "ring", img: "ring.png" },
    { fr: "des sandales", en: "sandals", img: "sandals.png" },
    { fr: "une écharpe", en: "scarf", img: "scarf.png" },
    { fr: "une chemise", en: "shirt", img: "shirt.png" },
    { fr: "des chaussures", en: "shoes", img: "shoes.png" },
    { fr: "un short", en: "shorts", img: "shorts.png" },
    { fr: "une jupe", en: "skirt", img: "skirt.png" },
    { fr: "des chaussettes", en: "socks", img: "socks.png" },
    { fr: "des bas", en: "stockings", img: "stockings.png" },
    { fr: "un costume", en: "suit", img: "suit.png" },
    { fr: "des lunettes de soleil", en: "sunglasses", img: "sun-glasses.png" },
    { fr: "un pull", en: "sweater", img: "sweater.png" },
    { fr: "un t-shirt", en: "t-shirt", img: "t-shirt.png" },
    { fr: "une cravate", en: "tie", img: "tie.png" },
    { fr: "un parapluie", en: "umbrella", img: "umbrella.png" },
    { fr: "des sous-vêtements", en: "underwear", img: "underwear.png" },
    { fr: "un portefeuille", en: "wallet", img: "wallet.png" },
    { fr: "une montre", en: "watch", img: "watch.png" }
];

let current = {};

function nextCard() {
    current = vocab[Math.floor(Math.random() * vocab.length)];

    const showFrench = Math.random() < 0.5;

    document.getElementById("word").innerText = showFrench ? current.fr : current.en;
    document.getElementById("image").src = current.img;
    document.getElementById("translation").innerText = showFrench ? current.en : current.fr;
    document.getElementById("translation").style.display = "none";
}

function showTranslation() {
    document.getElementById("translation").style.display = "block";
}

nextCard();
</script>

</body>
</html>
