<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>French Vocabulary Flashcards</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        display: flex;
        justify-content: center;
        padding: 20px;
    }
    #card {
        background: white;
        width: 350px;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        text-align: center;
    }
    img {
        width: 200px;
        height: 200px;
        object-fit: contain;
        margin-bottom: 15px;
    }
    button {
        padding: 10px 20px;
        margin: 10px;
        border: none;
        border-radius: 8px;
        background: #007bff;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }
    button:hover {
        background: #0056b3;
    }
    #translation {
        margin-top: 15px;
        font-size: 20px;
        font-weight: bold;
        color: #444;
    }
</style>
</head>
<body>

<div id="card">
    <img id="image" src="">
    <div id="word" style="font-size:24px; margin-bottom:10px;"></div>
    <button onclick="showAnswer()">Show answer</button>
    <button onclick="nextCard()">Next</button>
    <div id="translation"></div>
</div>

<script>
const vocab = [
    // ACCESSORIES & JEWELRY
    { fr: "une alliance", en: "wedding ring", img: "https://upload.wikimedia.org/wikipedia/commons/0/0e/Wedding_rings.jpg" },
    { fr: "une bague", en: "ring", img: "https://upload.wikimedia.org/wikipedia/commons/0/0f/Ring_gold.jpg" },
    { fr: "une bague de fiançailles", en: "engagement ring", img: "https://upload.wikimedia.org/wikipedia/commons/5/5e/Engagement_ring.jpg" },
    { fr: "une barrette", en: "barrette", img: "https://upload.wikimedia.org/wikipedia/commons/4/4e/Hair_barrette.jpg" },
    { fr: "les bijoux de fantaisie", en: "costume jewelry", img: "https://upload.wikimedia.org/wikipedia/commons/7/7e/Costume_jewelry.jpg" },
    { fr: "un bonnet", en: "hat / cap", img: "https://upload.wikimedia.org/wikipedia/commons/6/6e/Beanie_hat.jpg" },
    { fr: "une boucle d’oreille", en: "earring", img: "https://upload.wikimedia.org/wikipedia/commons/3/3b/Earrings.jpg" },
    { fr: "un bouton de manchette", en: "cufflink", img: "https://upload.wikimedia.org/wikipedia/commons/4/4d/Cufflinks.jpg" },
    { fr: "un bracelet", en: "bracelet", img: "https://upload.wikimedia.org/wikipedia/commons/3/3f/Bracelet.jpg" },
    { fr: "une broche", en: "brooch", img: "https://upload.wikimedia.org/wikipedia/commons/2/2b/Brooch.jpg" },
    { fr: "une ceinture", en: "belt", img: "https://upload.wikimedia.org/wikipedia/commons/2/2e/Belt.jpg" },
    { fr: "un chapeau", en: "hat", img: "https://upload.wikimedia.org/wikipedia/commons/8/8f/Fedora_hat.jpg" },
    { fr: "un collier", en: "necklace", img: "https://upload.wikimedia.org/wikipedia/commons/4/4d/Necklace.jpg" },
    { fr: "des lunettes", en: "glasses", img: "https://upload.wikimedia.org/wikipedia/commons/8/8e/Eyeglasses.jpg" },
    { fr: "des lunettes de soleil", en: "sunglasses", img: "https://upload.wikimedia.org/wikipedia/commons/8/8f/Sunglasses.jpg" },
    { fr: "une montre", en: "watch", img: "https://upload.wikimedia.org/wikipedia/commons/1/1e/Wristwatch.jpg" },
    { fr: "un parapluie", en: "umbrella", img: "https://upload.wikimedia.org/wikipedia/commons/0/0c/Umbrella.jpg" },
    { fr: "un portefeuille", en: "wallet", img: "https://upload.wikimedia.org/wikipedia/commons/0/0c/Wallet.jpg" },
    { fr: "un sac à dos", en: "backpack", img: "https://upload.wikimedia.org/wikipedia/commons/0/0c/Backpack.jpg" },
    { fr: "un sac à main", en: "purse", img: "https://upload.wikimedia.org/wikipedia/commons/4/4f/Handbag.jpg" },

    // BODY PARTS
    { fr: "des cheveux", en: "hair", img: "https://upload.wikimedia.org/wikipedia/commons/4/4d/Hair.jpg" },
    { fr: "une tête", en: "head", img: "https://upload.wikimedia.org/wikipedia/commons/1/1e/Human_head.jpg" },
    { fr: "un visage", en: "face", img: "https://upload.wikimedia.org/wikipedia/commons/0/0c/Face.jpg" },
    { fr: "un œil", en: "eye", img: "https://upload.wikimedia.org/wikipedia/commons/0/0e/Human_eye.jpg" },
    { fr: "un nez", en: "nose", img: "https://upload.wikimedia.org/wikipedia/commons/5/5c/Nose.jpg" },
    { fr: "une bouche", en: "mouth", img: "https://upload.wikimedia.org/wikipedia/commons/0/0b/Mouth.jpg" },
    { fr: "une oreille", en: "ear", img: "https://upload.wikimedia.org/wikipedia/commons/4/4c/Ear.jpg" },
    { fr: "un bras", en: "arm", img: "https://upload.wikimedia.org/wikipedia/commons/6/6f/Arm.jpg" },
    { fr: "une main", en: "hand", img: "https://upload.wikimedia.org/wikipedia/commons/8/8c/Hand.jpg" },
    { fr: "un doigt", en: "finger", img: "https://upload.wikimedia.org/wikipedia/commons/7/7e/Finger.jpg" },
    { fr: "une jambe", en: "leg", img: "https://upload.wikimedia.org/wikipedia/commons/4/4d/Leg.jpg" },
    { fr: "un pied", en: "foot", img: "https://upload.wikimedia.org/wikipedia/commons/8/8d/Foot.jpg" },

    // CLOTHING
    { fr: "un manteau", en: "coat", img: "https://upload.wikimedia.org/wikipedia/commons/7/7a/Coat.jpg" },
    { fr: "un pantalon", en: "pants", img: "https://upload.wikimedia.org/wikipedia/commons/8/8e/Trousers.jpg" },
    { fr: "un pull", en: "sweater", img: "https://upload.wikimedia.org/wikipedia/commons/4/4c/Sweater.jpg" },
    { fr: "un tee-shirt", en: "T-shirt", img: "https://upload.wikimedia.org/wikipedia/commons/6/6e/Tshirt.jpg" },
    { fr: "des bottes", en: "boots", img: "https://upload.wikimedia.org/wikipedia/commons/2/2a/Boots.jpg" },
    { fr: "des sandales", en: "sandals", img: "https://upload.wikimedia.org/wikipedia/commons/8/8e/Sandals.jpg" },
    { fr: "des chaussures", en: "shoes", img: "https://upload.wikimedia.org/wikipedia/commons/0/0f/Shoes.jpg" },
    { fr: "des chaussettes", en: "socks", img: "https://upload.wikimedia.org/wikipedia/commons/3/3e/Socks.jpg" },
    { fr: "une robe", en: "dress", img: "https://upload.wikimedia.org/wikipedia/commons/2/2f/Dress.jpg" },
    { fr: "une jupe", en: "skirt", img: "https://upload.wikimedia.org/wikipedia/commons/4/4d/Skirt.jpg" },
    { fr: "une chemise", en: "shirt", img: "https://upload.wikimedia.org/wikipedia/commons/3/3c/Shirt.jpg" },
    { fr: "une cravate", en: "tie", img: "https://upload.wikimedia.org/wikipedia/commons/4/4b/Tie.jpg" }
];

let currentCard;

function nextCard() {
    currentCard = vocab[Math.floor(Math.random() * vocab.length)];

    const showFrench = Math.random() < 0.5;

    document.getElementById("image").src = currentCard.img;
    document.getElementById("word").textContent = showFrench ? currentCard.fr : currentCard.en;
    document.getElementById("translation").textContent = "";
}

function showAnswer() {
    const wordShown = document.getElementById("word").textContent;
    document.getElementById("translation").textContent =
        wordShown === currentCard.fr ? currentCard.en : currentCard.fr;
}

nextCard();
</script>

</body>
</html>
